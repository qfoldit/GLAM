name: GLAM adapter contract checks

on:
  push:
    paths:
      - "integrations/qfoldit_glam/**"
      - "src_1gp/glam.py"
      - "src_1gp/trainer.py"
      - "src_1gp/dataset.py"
      - "src_1gp/utils.py"
      - "src_1gp/logger.py"
      - "src_1gp/run.py"
      - "src_1gp/reproducibility.py"
      - ".github/workflows/glam-adapter-check.yml"
  pull_request:
    paths:
      - "integrations/qfoldit_glam/**"
      - ".github/workflows/glam-adapter-check.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile adapter and GLAM runtime
        run: python -m py_compile integrations/qfoldit_glam/server.py src_1gp/glam.py src_1gp/trainer.py src_1gp/dataset.py src_1gp/utils.py src_1gp/logger.py src_1gp/run.py src_1gp/reproducibility.py
      - name: Test deterministic search helpers
        run: python -m unittest src_1gp.test_reproducibility
      - name: Run standard-library tests
        run: python -m unittest discover -s integrations/qfoldit_glam -p "test_*.py"
      - name: Validate JSON schemas
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('integrations/qfoldit_glam').glob('*.schema.json')]"
