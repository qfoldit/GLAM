name: GLAM adapter and pipeline contract checks

on:
  push:
    paths:
      - "integrations/qfoldit_glam/**"
      - "src_1gp/**"
      - ".github/workflows/glam-adapter-check.yml"
  pull_request:
    paths:
      - "integrations/qfoldit_glam/**"
      - "src_1gp/**"
      - ".github/workflows/glam-adapter-check.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile integration and research pipeline
        run: |
          python -m py_compile integrations/qfoldit_glam/server.py
          python -m compileall -q src_1gp
      - name: Run adapter and source-contract tests
        run: python -m unittest discover -s integrations/qfoldit_glam -p "test_*.py" -v
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path("integrations/qfoldit_glam").glob("*.schema.json"))
          assert paths, "No adapter JSON schemas found"
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"VALID JSON: {path}")
          PY
